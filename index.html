<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Creatief Techniek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      background-color: #000;
      height: 100%;
      overflow: hidden;
    }

    .hero-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .image-container {
      position: relative;
      display: inline-block;
    }

    .insta-hotspot {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      cursor: pointer;
      background-color: transparent;
      border: none;
      z-index: 10;

      /* ✅ hotspot positie binnen de afbeelding zelf */
      top: 61.5%;
      left: 64.2%;
      transform: translate(-50%, -50%);
      transition: box-shadow 0.3s ease;
    }

    .insta-hotspot:hover {
      box-shadow: 0 0 20px rgba(255, 220, 100, 0.4),
                  0 0 40px rgba(255, 220, 100, 0.2);
    }
  </style>
</head>

<body>

  <div class="hero-wrapper">
    <div class="image-container">
      <img src="achtergrond knop.png" class="hero-img" alt="Creatief Techniek achtergrond">
      <button class="insta-hotspot"
        onclick="window.open('https://instagram.com/creatieftechniek', '_blank')">
      </button>
    </div>
  </div>

</body>
</html>
