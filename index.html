<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Creatief Techniek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* Hero achtergrond */
    .hero {
      background-image: url('achtegrond.png'); /* <-- jouw achtergrond */
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100%;
    }

    /* Tekst onder hero */
    .social-text {
      text-align: center;
      font-size: 1.8em;
      margin-top: 30px;
      color: #f0e68c;
      font-weight: 600;
      text-shadow: 1px 1px 3px #000;
    }

    /* Instagram knop (oude stijl) */
    .insta-button {
      display: inline-block;
      margin: 25px auto 60px auto;
      padding: 18px 32px;
      background-color: #f0e68c;
      color: #111;
      font-size: 1.4em;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(240, 230, 140, 0.8);
      transition: 0.2s ease;
    }

    .insta-button:hover {
      background-color: #fff8c6;
      box-shadow: 0 0 25px rgba(255, 255, 200, 1);
    }

    /* Nieuwe industriële ronde rode knop rechts */
    .insta-round {
      position: fixed;
      top: 50%;
      right: 30px;
      transform: translateY(-50%);
      width: 95px;
      height: 95px;
      background: radial-gradient(circle at 30% 30%, #b33, #600);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1em;
      font-weight: bold;
      color: #f5d7a1;
      cursor: pointer;
      border: 3px solid #3a1a1a;
      box-shadow:
        inset 0 0 12px rgba(0,0,0,0.7),
        0 0 18px rgba(120,0,0,0.8),
        0 6px 12px rgba(0,0,0,0.6);
      transition: 0.2s ease;
      z-index: 9999;
      text-shadow: 1px 1px 2px #000;
    }

    .insta-round:hover {
      background: radial-gradient(circle at 30% 30%, #cc4444, #700);
      box-shadow:
        inset 0 0 18px rgba(0,0,0,0.8),
        0 0 25px rgba(150,0,0,1),
        0 8px 16px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>

  <!-- Hero zonder tekst -->
  <div class="hero"></div>

  <!-- Instagram sectie -->
  <div class="social-text">Volg ons op Instagram</div>

  <div style="text-align:center;">
    <a class="insta-button" href="https://instagram.com/creatieftechniek" target="_blank" rel="noopener">
      📸 @creatieftechniek
    </a>
  </div>

  <!-- Nieuwe ronde industriële knop -->
  <button class="insta-round" onclick="window.open('https://instagram.com/creatieftechniek', '_blank')">
    INSTAGRAM
  </button>

</body>
</html>
