<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Creatief Techniek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* Hero achtergrond */
    .hero {
      background-image: url('creatief techniek mad max met geel.png'); /* <-- vul hier jouw bestandsnaam of URL in */
      background-size: cover;
      background-position: center;
      height: 90vh;
      width: 90%;
    }

    /* Tekst onder hero */
    .social-text {
      text-align: center;
      font-size: 1.8em;
      margin-top: 30px;
      color: #f0e68c;
      font-weight: 600;
      text-shadow: 1px 1px 3px #000;
    }

    /* Instagram knop */
    .insta-button {
      display: inline-block;
      margin: 25px auto 60px auto;
      padding: 18px 32px;
      background-color: #f0e68c;
      color: #111;
      font-size: 1.4em;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(240, 230, 140, 0.8);
      transition: 0.2s ease;
    }

    .insta-button:hover {
      background-color: #fff8c6;
      box-shadow: 0 0 25px rgba(255, 255, 200, 1);
    }
  </style>
</head>

<body>

  <!-- Hero zonder tekst -->
  <div class="hero"></div>

  <!-- Instagram sectie -->
  <div class="social-text">Volg ons op Instagram</div>

  <div style="text-align:center;">
    <a class="insta-button" href="https://instagram.com/creatieftechniek" target="_blank" rel="noopener">
      📸 @creatieftechniek
    </a>
  </div>
