<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Creatief Techniek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden; /* voorkomt scrollen */
    }

    /* Achtergrondafbeelding perfect passend binnen 1 scherm */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('achtergrond knop .png'); /* jouw afbeelding */
      background-size: contain;       /* afbeelding past volledig binnen het scherm */
      background-repeat: no-repeat;   /* geen herhaling */
      background-position: center;    /* mooi gecentreerd */
      background-color: #000;         /* vult randen netjes op */
    }

    /* Klikbare hotspot op de Instagram-knop in de afbeelding */
    .insta-hotspot {
      position: absolute;
      top: 59%;      /* positie van de knop in de afbeelding */
      left: 62%;     /* positie van de knop in de afbeelding */
      width: 80px;  /* grootte van de klikbare zone */
      height: 130px;
      border-radius: 50%; /* maakt hem rond */
      cursor: pointer;
      background-color: transparent;rgba(255, 255, 255, 0); /* volledig transparant */
      border: none;
      z-index: 10;
    }

    .insta-hotspot:hover {
      outline: 2px solid rgba(255, 255, 150, 0.3); /* optioneel: lichte hover-glow */
    }
  </style>
</head>

<body>

  <div class="hero">
    <button class="insta-hotspot"
      onclick="window.open('https://instagram.com/creatieftechniek', '_blank')">
    </button>
  </div>

</body>
</html>
