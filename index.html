<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Creatief Techniek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* Hero achtergrond */
    .hero {
      position: relative; /* nodig om de knop IN de foto te plaatsen */
      background-image: url('achtegrond.png');
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100%;
    }

    /* Industriële ronde rode knop IN de achtergrond */
    .insta-round {
      position: absolute;
      top: 65%;          /* pas aan voor perfecte positie */
      right: 8%;         /* pas aan voor perfecte positie */
      width: 95px;
      height: 95px;
      background: radial-gradient(circle at 30% 30%, #b33, #600);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1em;
      font-weight: bold;
      color: #f5d7a1;
      cursor: pointer;
      border: 3px solid #3a1a1a;
      box-shadow:
        inset 0 0 12px rgba(0,0,0,0.7),
        0 0 18px rgba(120,0,0,0.8),
        0 6px 12px rgba(0,0,0,0.6);
      transition: 0.2s ease;
      text-shadow: 1px 1px 2px #000;
      z-index: 10;
    }

    .insta-round:hover {
      background: radial-gradient(circle at 30% 30%, #cc4444, #700);
      box-shadow:
        inset 0 0 18px rgba(0,0,0,0.8),
        0 0 25px rgba(150,0,0,1),
        0 8px 16px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>

  <!-- Hero met knop erin -->
  <div class="hero">
    <button class="insta-round" onclick="window.open('https://instagram.com/creatieftechniek', '_blank')">
      INSTAGRAM
    </button>
  </div>

</body>
