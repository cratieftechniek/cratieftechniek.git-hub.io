<script>
/* --- Kleur --- */
const colorMap = { "Zwart": 0x777777 };

/* --- Prijsinstellingen --- */
const startPrice = 5.00;
const materialPricing = {
    PLA:{pricePerCM3:0.09},
    PETG:{pricePerCM3:0.12},
    TPU:{pricePerCM3:0.18}
};

/* --- Elementen --- */
const fileInput=document.getElementById("fileInput");
const materialSelect=document.getElementById("material");
const colorSelect=document.getElementById("color");
const qtyInput=document.getElementById("quantity");
const outputDiv=document.getElementById("output");
const emailButton=document.getElementById("emailButton");
const fileNameDiv=document.getElementById("fileName");

/* Materialen laden */
for(let m in materialPricing){
    let o=document.createElement("option");
    o.value=m;
    o.textContent=m;
    materialSelect.appendChild(o);
}

let currentVolume=null;

/* --- Upload meerdere bestandstypen --- */
fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    fileNameDiv.textContent = "Bestand: " + file.name;
    const ext = file.name.split(".").pop().toLowerCase();

    if (ext === "stl") {
        const buffer = await file.arrayBuffer();
        const geometry = new THREE.STLLoader().parse(buffer);
        processGeometry(geometry);
    }

    else if (ext === "obj") {
        const text = await file.text();
        const obj = new THREE.OBJLoader().parse(text);
        const geometry = obj.children[0].geometry;
        processGeometry(geometry);
    }

    else if (ext === "3mf") {
        const buffer = await file.arrayBuffer();
        const model = new THREE.ThreeMFLoader().parse(buffer);
        const geometry = model.children[0].geometry;
        processGeometry(geometry);
    }

    else {
        currentVolume = null;
        outputDiv.innerHTML = "Dit bestandstype wordt niet ondersteund.";
    }
});

/* --- Universele verwerking --- */
function processGeometry(geometry) {
    geometry.computeVertexNormals();
    geometry.center();

    loadGeometryIntoViewer(geometry);

    currentVolume = calculateMeshVolume(geometry);
    updatePrice();
}

/* --- Universele viewer --- */
let scene=new THREE.Scene();
scene.background=new THREE.Color(0xf2f2f2);

let camera=new THREE.PerspectiveCamera(60,1,0.1,2000);
camera.position.set(100,100,100);

let renderer=new THREE.WebGLRenderer({antialias:true});
const container=document.getElementById("viewer-container");

function initRenderer() {
    const w = container.clientWidth || 500;
    const h = container.clientHeight || 400;
    renderer.setSize(w, h);
    container.appendChild(renderer.domElement);
}
window.addEventListener("load", initRenderer);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xcccccc));
let light=new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(100,100,100);
scene.add(light);

let mesh;

function loadGeometryIntoViewer(geometry) {
    if (mesh) scene.remove(mesh);

    mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshPhongMaterial({ color: colorMap[colorSelect.value] })
    );

    scene.add(mesh);

    geometry.computeBoundingSphere();
    const r = geometry.boundingSphere.radius;
    camera.position.set(r * 2, r * 2, r * 2);
}

function updateViewerColor(colorName){
    if(mesh)mesh.material.color.setHex(colorMap[colorName]);
}

/* --- Volume berekening voor alle formaten --- */
function calculateMeshVolume(geometry) {
    let pos = geometry.attributes.position;
    let volume = 0;

    for (let i = 0; i < pos.count; i += 3) {
        const p1 = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
        const p2 = new THREE.Vector3(pos.getX(i+1), pos.getY(i+1), pos.getZ(i+1));
        const p3 = new THREE.Vector3(pos.getX(i+2), pos.getY(i+2), pos.getZ(i+2));

        volume += p1.dot(p2.cross(p3)) / 6;
    }

    return Math.abs(volume); // mm³
}

/* --- Prijsberekening --- */
qtyInput.addEventListener("input",updatePrice);
materialSelect.addEventListener("change",updatePrice);
colorSelect.addEventListener("change",()=>{
    updateViewerColor(colorSelect.value);
    updatePrice();
});

function updatePrice(){
    if(!currentVolume){
        outputDiv.innerHTML="Upload een STL, OBJ of 3MF om prijs te berekenen.";
        return;
    }

    const cm3=currentVolume/1000;
    const mat=materialSelect.value;
    const clr=colorSelect.value;
    const qty=parseInt(qtyInput.value)||1;

    const base=startPrice + cm3*materialPricing[mat].pricePerCM3;
    const total=base*qty;

    let discount=0;
    if(qty>=10)discount=0.15;
    else if(qty>=5)discount=0.10;
    else if(qty>=2)discount=0.05;

    const final=total*(1-discount);

    let html=`Volume: ${cm3.toFixed(2)} cm³<br>`;
    if(discount>0){
        html+=`<span class="old-price">€${total.toFixed(2)}</span>
        <span class="price">€${final.toFixed(2)}</span>
        <div class="discount">${discount*100}% korting</div>`;
    }else{
        html+=`<div class="price">€${total.toFixed(2)}</div>`;
    }

    outputDiv.innerHTML=html;

    emailButton.href=
        `mailto:creatieftechniek@hotmail.com?subject=Offerte 3D Print`+
        `&body=Beste,%0D%0A%0D%0A`+
        `Graag ontvang ik een offerte voor:%0D%0A`+
        `- Materiaal: ${mat}%0D%0A`+
        `- Kleur: ${clr}%0D%0A`+
        `- Aantal: ${qty}%0D%0A`+
        `- Volume: ${cm3.toFixed(2)} cm³%0D%0A%0D%0A`+
        `- Prijsindicatie: €${final.toFixed(2)}%0D%0A%0D%0A`;
}

/* --- Render loop --- */
window.addEventListener("resize", () => {
    const w = container.clientWidth || 500;
    const h = container.clientHeight || 400;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
animate();
</script>
