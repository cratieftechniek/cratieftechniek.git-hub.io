<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Calculator – Creatief Techniek</title>

<!-- THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
:root { --accent: #f5d08a; }

/* --- Achtergrond zoals projecten.html --- */
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    position: relative;
    padding-top: 160px; /* ruimte voor quickbar */
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent 70%);
    z-index: -1;
    pointer-events: none;
}

/* --- QUICKBAR (exact zoals projecten.html) --- */
.quickbar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    padding: 14px 26px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,200,120,0.25);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    z-index: 1200;
}

.quickbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: bold;
}

.quickbar img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    opacity: 0.9;
    transition: 0.2s;
}

.quickbar img:hover {
    opacity: 1;
    box-shadow: 0 0 12px rgba(255,200,120,0.6);
}

/* --- Layout --- */
.wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}

.card
