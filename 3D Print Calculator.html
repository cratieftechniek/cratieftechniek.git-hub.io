<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Calculator – Creatief Techniek</title>

<!-- THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<style>
:root { --accent: #f5d08a; }

/* --- Achtergrond zoals projecten.html --- */
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    position: relative;
    padding-top: 160px; /* ruimte voor quickbar */
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent 70%);
    z-index: -1;
    pointer-events: none;
}

/* --- QUICKBAR (exact zoals projecten.html) --- */
.quickbar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    padding: 14px 26px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,200,120,0.25);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    z-index: 1200;
}

.quickbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: bold;
}

.quickbar img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    opacity: 0.9;
    transition: 0.2s;
}

.quickbar img:hover {
    opacity: 1;
    box-shadow: 0 0 12px rgba(255,200,120,0.6);
}

/* --- Layout --- */
.wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    margin-bottom: 30px;
}

h1, h2 {
    color: var(--accent);
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #555;
    background: rgba(255,255,255,0.1);
    color: #fff;
}

.btn {
    margin-top: 20px;
    display: block;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #000;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    text-decoration: none;
}

#viewer-container {
    width: 100%;
    height: 500px;
    border-radius: 10px;
    background: #111;
    border: 1px solid rgba(255,255,255,0.15);
}

.price {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--accent);
}

.old-price {
    text-decoration: line-through;
    color: red;
}

.discount {
    color: red;
    font-weight: bold;
}

@media (max-width: 600px) {
    .quickbar {
        gap: 10px;
        padding: 8px 12px;
    }

    .quickbar img {
        width: 34px;
        height: 34px;
    }

    .quickbar span {
        font-size: 11px;
    }

    body {
        padding-top: 130px;
    }
}
</style>
</head>

<body>

<!-- QUICKBAR wordt automatisch geladen -->
<div id="quickbar-container"></div>

<script>
fetch("quickbar.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("quickbar-container").innerHTML = html;
    });
</script>

<div class="wrapper">

<h1>3D Print Calculator</h1>

<div class="card">
    <h2>Offerte Instellingen</h2>

    <label>Upload STL bestand</label>
    <input id="fileInput" type="file" accept=".stl">
    <div id="fileName"></div>

    <label>Materiaal</label>
    <select id="material"></select>

    <label>Kleur</label>
    <select id="color">
        <option value="Zwart">Zwart</option>
    </select>

    <label>Aantal</label>
    <input id="quantity" type="number" min="1" value="1">

    <div id="output" style="margin-top:20px;">Upload een STL om de prijs te berekenen.</div>

    <a id="emailButton" class="btn" href="#">Vraag Offerte Aan</a>
</div>

<div class="card">
    <h2>3D Model Viewer</h2>
    <div id="viewer-container"></div>
</div>

</div>

<script>
/* --- Kleur --- */
const colorMap = { "Zwart": 0x333333 };

/* --- Prijsinstellingen --- */
const startPrice = 5.00;
const materialPricing = {
    PLA:{pricePerCM3:0.09},
    PETG:{pricePerCM3:0.12},
    TPU:{pricePerCM3:0.18}
};

/* --- Elementen --- */
const fileInput=document.getElementById("fileInput");
const materialSelect=document.getElementById("material");
const colorSelect=document.getElementById("color");
const qtyInput=document.getElementById("quantity");
const outputDiv=document.getElementById("output");
const emailButton=document.getElementById("emailButton");
const fileNameDiv=document.getElementById("fileName");

/* Materialen laden */
for(let m in materialPricing){
    let o=document.createElement("option");
    o.value=m;
    o.textContent=m;
    materialSelect.appendChild(o);
}

let currentVolume=null;

/* --- STL upload --- */
fileInput.addEventListener("change",async(e)=>{
    const file=e.target.files[0];
    if(!file)return;

    fileNameDiv.textContent="Bestand: "+file.name;

    const buffer=await file.arrayBuffer();
    currentVolume=parseSTL(buffer);

    loadSTLIntoViewer(buffer,colorSelect.value);
    updatePrice();
});

/* --- Events --- */
qtyInput.addEventListener("input",updatePrice);
materialSelect.addEventListener("change",updatePrice);
colorSelect.addEventListener("change",()=>{
    updateViewerColor(colorSelect.value);
    updatePrice();
});

/* --- Prijsberekening --- */
function updatePrice(){
    if(!currentVolume){
        outputDiv.innerHTML="Upload een STL om prijs te berekenen.";
        return;
    }

    const cm3=currentVolume/1000;
    const mat=materialSelect.value;
    const clr=colorSelect.value;
    const qty=parseInt(qtyInput.value)||1;

    const base=startPrice + cm3*materialPricing[mat].pricePerCM3;
    const total=base*qty;

    let discount=0;
    if(qty>=10)discount=0.15;
    else if(qty>=5)discount=0.10;
    else if(qty>=2)discount=0.05;

    const final=total*(1-discount);

    let html=`Volume: ${cm3.toFixed(2)} cm³<br>`;
    if(discount>0){
        html+=`<span class="old-price">€${total.toFixed(2)}</span>
        <span class="price">€${final.toFixed(2)}</span>
        <div class="discount">${discount*100}% korting</div>`;
    }else{
        html+=`<div class="price">€${total.toFixed(2)}</div>`;
    }

    outputDiv.innerHTML=html;

    emailButton.href=
        `mailto:creatieftechniek@hotmail.com?subject=Offerte 3D Print`+
        `&body=Beste,%0D%0A%0D%0A`+
        `Graag ontvang ik een offerte voor:%0D%0A`+
        `- Materiaal: ${mat}%0D%0A`+
        `- Kleur: ${clr}%0D%0A`+
        `- Aantal: ${qty}%0D%0A`+
        `- Volume: ${cm3.toFixed(2)} cm³%0D%0A`+
        `- Prijsindicatie: €${final.toFixed(2)}%0D%0A%0D%0A`+
        `STL-bestand wordt handmatig toegevoegd.`;
}

/* --- STL parser --- */
function parseSTL(buffer){
    const view=new DataView(buffer);
    const triCount=view.getUint32(80,true);
    let offset=84;
    let volume=0;

    function signedVolume(p1,p2,p3){
        return (p1[0]*(p2[1]*p3[2]-p2[2]*p3[1]) -
                p1[1]*(p2[0]*p3[2]-p2[2]*p3[0]) +
                p1[2]*(p2[0]*p3[1]-p2[1]*p3[0]))/6;
    }

    for(let i=0;i<triCount;i++){
        offset+=12;
        let v=[];
        for(let j=0;j<3;j++){
            v.push([
                view.getFloat32(offset,true),
                view.getFloat32(offset+4,true),
                view.getFloat32(offset+8,true)
            ]);
            offset+=12;
        }
        offset+=2;
        volume+=signedVolume(v[0],v[1],v[2]);
    }
    return Math.abs(volume);
}

/* --- 3D viewer --- */
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);

let camera=new THREE.PerspectiveCamera(60,1,0.1,2000);
camera.position.set(100,100,100);

let renderer=new THREE.WebGLRenderer({antialias:true});
const container=document.getElementById("viewer-container");
renderer.setSize(container.clientWidth,container.clientHeight);
container.appendChild(renderer.domElement);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0x888888));
let light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(100,100,100);
scene.add(light);

let mesh;

function loadSTLIntoViewer(buffer,colorName){
    const loader=new THREE.STLLoader();
    const geometry=loader.parse(buffer);

    geometry.center();

    if(mesh)scene.remove(mesh);

    mesh=new THREE.Mesh(
        geometry,
        new THREE.MeshPhongMaterial({color:colorMap[colorName]})
    );

    scene.add(mesh);

    geometry.computeBoundingSphere();
    const radius=geometry.boundingSphere.radius;
    camera.position.set(radius*2,radius*2,radius*2);
}

function updateViewerColor(colorName){
    if(mesh)mesh.material.color.setHex(colorMap[colorName]);
}

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
