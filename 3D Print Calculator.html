<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Calculator – Creatief Techniek</title>

<!-- THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3MFLoader.js"></script>

<style>
:root { --accent: #f5d08a; }

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    position: relative;
    padding-top: 160px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent 70%);
    z-index: -1;
    pointer-events: none;
}

.quickbar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    padding: 14px 26px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,200,120,0.25);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    z-index: 1200;
}

.quickbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: bold;
}

.quickbar img {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    opacity: 0.9;
    transition: 0.2s;
}

.quickbar img:hover {
    opacity: 1;
    box-shadow: 0 0 12px rgba(255,200,120,0.6);
}

.wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    margin-bottom: 30px;
}

h1, h2 {
    color: var(--accent);
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid rgba(255,200,120,0.35);
    background: rgba(0,0,0,0.55);
    color: var(--accent);
    font-weight: bold;
}

.btn {
    margin-top: 20px;
    display: block;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #000;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    text-decoration: none;
}

#viewer-container {
    width: 100%;
    height: 500px;
    min-height: 300px;
    border-radius: 10px;
    background: #f2f2f2;
    border: 1px solid rgba(0,0,0,0.15);
}

.price {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--accent);
}
</style>
</head>

<body>

<!-- QUICKBAR -->
<div id="quickbar-container"></div>
<script>
fetch("quickbar.html")
    .then(r => r.text())
    .then(html => document.getElementById("quickbar-container").innerHTML = html);
</script>

<div class="wrapper">

<h1>3D Print Calculator</h1>

<div class="card">
    <h2>Offerte Instellingen</h2>

    <label>Upload 3D-bestand (STL, OBJ, 3MF)</label>
    <input id="fileInput" type="file" accept=".stl,.obj,.3mf">
    <div id="fileName"></div>

    <label>Materiaal</label>
    <select id="material"></select>

    <label>Kleur</label>
    <select id="color">
        <option value="Zwart">Zwart</option>
    </select>

    <label>Aantal</label>
    <input id="quantity" type="number" min="1" value="1">

    <div id="output" style="margin-top:20px;">
        Upload een STL, OBJ of 3MF om de prijs te berekenen.
    </div>

    <a id="emailButton" class="btn" href="#">Vraag Offerte Aan</a>
</div>

<div class="card">
    <h2>3D Model Viewer</h2>
    <div id="viewer-container"></div>
</div>

</div>

<script>
/* --- Kleur --- */
const colorMap = { "Zwart": 0x777777 };

/* --- Prijsinstellingen --- */
const startPrice = 5.00;
const materialPricing = {
    PLA:{pricePerCM3:0.09},
    PETG:{pricePerCM3:0.12},
    TPU:{pricePerCM3:0.18}
};

/* --- Elementen --- */
const fileInput=document.getElementById("fileInput");
const materialSelect=document.getElementById("material");
const colorSelect=document.getElementById("color");
const qtyInput=document.getElementById("quantity");
const outputDiv=document.getElementById("output");
const emailButton=document.getElementById("emailButton");
const fileNameDiv=document.getElementById("fileName");

/* Materialen laden */
for(let m in materialPricing){
    let o=document.createElement("option");
    o.value=m;
    o.textContent=m;
    materialSelect.appendChild(o);
}

let currentVolume=null;

/* --- Upload meerdere bestandstypen --- */
fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    fileNameDiv.textContent = "Bestand: " + file.name;
    const ext = file.name.split(".").pop().toLowerCase();

    if (ext === "stl") {
        const buffer = await file.arrayBuffer();
        const geometry = new THREE.STLLoader().parse(buffer);
        processGeometry(geometry);
    }

    else if (ext === "obj") {
        const text = await file.text();
        const obj = new THREE.OBJLoader().parse(text);
        const geometry = obj.children[0].geometry;
        processGeometry(geometry);
    }

    else if (ext === "3mf") {
        const buffer = await file.arrayBuffer();
        const model = new THREE.ThreeMFLoader().parse(buffer);
        const geometry = model.children[0].geometry;
        processGeometry(geometry);
    }

    else {
        currentVolume = null;
        outputDiv.innerHTML = "Dit bestandstype wordt niet ondersteund.";
    }
});

/* --- Universele verwerking --- */
function processGeometry(geometry) {
    geometry.computeVertexNormals();
    geometry.center();

    loadGeometryIntoViewer(geometry);

    currentVolume = calculateMeshVolume(geometry);
    updatePrice();
}

/* --- Viewer setup --- */
let scene=new THREE.Scene();
scene.background=new THREE.Color(0xf2f2f2);

let camera=new THREE.PerspectiveCamera(60,1,0.1,2000);
camera.position.set(100,100,100);

let renderer=new THREE.WebGLRenderer({antialias:true});
const container=document.getElementById("viewer-container");

function initRenderer() {
    const w = container.clientWidth || 500;
    const h = container.clientHeight || 400;
    renderer.setSize(w, h);
    container.appendChild(renderer.domElement);
}
window.addEventListener("load", initRenderer);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xcccccc));
let light=new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(100,100,100);
scene.add(light);

let mesh;

/* --- Universele viewer --- */
function loadGeometryIntoViewer(geometry) {
    if (mesh) scene.remove(mesh);

    mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshPhongMaterial({ color: colorMap[colorSelect.value] })
    );

    scene.add(mesh);

    geometry.computeBoundingSphere();
    const r = geometry.boundingSphere.radius;
    camera.position.set(r * 2, r * 2, r * 2);
}

/* --- Kleur update --- */
function updateViewerColor(colorName){
    if(mesh)mesh.material.color.setHex(colorMap[colorName]);
}

/* --- Volume berekening voor STL, OBJ, 3MF --- */
function calculateMeshVolume(geometry) {
    let pos = geometry.attributes.position;
    let volume = 0;

    for (let i = 0; i < pos.count; i += 3) {
        const p1 = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
        const p2 = new THREE.Vector3(pos.getX(i+1), pos.getY(i+1), pos.getZ(i+1));
        const p3 = new THREE.Vector3(pos.getX(i+2), pos.getY(i+2), pos.getZ(i+2));

        volume += p1.dot(p2.cross(p3)) / 6;
    }

    return Math.abs(volume);
}

/* --- Prijsberekening --- */
qtyInput.addEventListener("input",updatePrice);
materialSelect.addEventListener("change",updatePrice);
colorSelect.addEventListener("change",()=>{
    updateViewerColor(colorSelect.value);
    updatePrice();
});

function updatePrice(){
    if(!currentVolume){
        outputDiv.innerHTML="Upload een STL, OBJ of 3MF om prijs te berekenen.";
        return;
    }

    const cm3=currentVolume/1000;
    const mat=materialSelect.value;
    const clr=colorSelect.value;
    const qty=parseInt(qtyInput.value)||1;

    const base=startPrice + cm3*materialPricing[mat].pricePerCM3;
    const total=base*qty;

    let discount=0;
    if(qty>=10)discount=0.15;
    else if(qty>=5)discount=0.10;
    else if(qty>=2)discount=0.05;

    const final=total*(1-discount);

    let html=`Volume: ${cm3.toFixed(2)} cm³<br>`;
    if(discount>0){
        html+=`<span class="old-price">€${total.toFixed(2)}</span>
        <span class="price">€${final.toFixed(2)}</span>
        <div class="discount">${discount*100}% korting</div>`;
    }else{
        html+=`<div class="price">€${total.toFixed(2)}</div>`;
    }

    outputDiv.innerHTML=html;
}

/* --- Viewer render loop --- */
window.addEventListener("resize", () => {
    const w = container.clientWidth || 500;
    const h = container.clientHeight || 400;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
