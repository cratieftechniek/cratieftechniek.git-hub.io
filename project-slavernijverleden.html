<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesprek Slavernijverleden – Creatief Techniek</title>

<style>
    :root { --accent: #f5d08a; }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        position: relative;
    }

    /* LICHTE TINTEN / GLOW ACHTERGROND */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent 70%);
        z-index: -1;
        pointer-events: none;
    }

    /* NAVIGATIE */
    .nav-header {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        z-index: 50;
    }

    .nav-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: bold;
        background: rgba(0,0,0,0.6);
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255,200,120,0.25);
        transition: 0.2s;
    }

    .nav-link:hover {
        background: rgba(255,200,120,0.15);
    }

    .nav-follow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-weight: bold;
    }

    .insta-icon img {
        width: 45px;
        opacity: 0.9;
        transition: 0.2s;
    }

    .insta-icon img:hover {
        opacity: 1;
    }

    /* PAGINA LAYOUT */
    .wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 140px 20px 40px;
        position: relative;
        z-index: 2;
    }

    h1 {
        color: var(--accent);
        margin-bottom: 20px;
    }

    h2 {
        color: var(--accent);
        margin-top: 30px;
    }

    p {
        line-height: 1.6;
    }

    /* SLIDESHOW */
    .slideshow-container {
        position: relative;
        width: 100%;
        height: 600px;
        overflow: hidden;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        cursor: pointer;
        margin-top: 40px;
        background: #000;
    }

    .slide {
        display: none;
        width: 100%;
        height: 100%;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    .prev, .next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        padding: 16px;
        background: rgba(0,0,0,0.4);
        border-radius: 6px;
        font-size: 26px;
        color: var(--accent);
        cursor: pointer;
        user-select: none;
        z-index: 10;
    }

    .prev:hover, .next:hover {
        background: rgba(255,200,120,0.2);
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .dots {
        text-align: center;
        margin-top: 12px;
    }

    .dot {
        cursor: pointer;
        height: 12px;
        width: 12px;
        margin: 0 4px;
        background-color: #444;
        border-radius: 50%;
        display: inline-block;
        transition: background-color 0.3s;
    }

    .active, .dot:hover {
        background-color: var(--accent);
    }

    .fullscreen-close {
        position: fixed;
        top: 20px;
        right: 20px;
        font-size: 32px;
        color: var(--accent);
        background: rgba(0,0,0,0.6);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        z-index: 9999;
        display: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
        .slideshow-container { height: 450px; }
        .nav-header { top: 10px; right: 10px; gap: 15px; }
        .nav-link { padding: 8px 14px; font-size: 14px; }
        .insta-icon img { width: 32px; }
    }

    @media (max-width: 600px) {
        .nav-header {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            gap: 10px;
            z-index: 999;
        }
        .slideshow-container { height: 300px; }
        .prev, .next { font-size: 18px; padding: 10px; }
        .fullscreen-close { font-size: 26px; padding: 6px 10px; }
        h1 { font-size: 26px; }
        h2 { font-size: 20px; }
        p { font-size: 15px; }
    }
</style>
</head>

<body>

<header class="nav-header">
    <a href="index.html" class="nav-link">Home</a>
    <a href="projecten.html" class="nav-link">Projecten</a>
    <div class="nav-follow">
        <span>Volg ons op:</span>
        <a href="https://www.instagram.com/creatieftechniek" target="_blank" class="insta-icon">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>
</header>

<div class="wrapper">

<h1>Gesprek Slavernijverleden</h1>

<p>
    Voor het project <strong>Gesprek Slavernijverleden</strong> vervulde ik een technische rol binnen de realisatie van de installatie.
</p>

<h2>Foto’s</h2>

<div id="fsClose" class="fullscreen-close" onclick="closeFullscreen()">✕</div>

<div class="slideshow-container" onclick="openFullscreen(this)">

    <div class="slide"><img src="slavernij1.jpg"></div>
    <div class="slide"><img src="slavernij2.jpg"></div>
    <div class="slide"><img src="slavernij3.jpg"></div>
    <div class="slide"><img src="slavernij4.jpg"></div>
    <div class="slide"><img src="slavernij5.jpg"></div>
    <div class="slide"><img src="slavernij6.jpg"></div>
    <div class="slide"><img src="slavernij7.jpg"></div>
    <div class="slide"><img src="slavernij8.jpg"></div>
    <div class="slide"><img src="slavernij9.jpg"></div>
    <div class="slide"><img src="slavernij10.jpg"></div>
    <div class="slide"><img src="slavernij11.jpg"></div>

    <a class="prev" onclick="event.stopPropagation(); plusSlides(-1)">❮</a>
    <a class="next" onclick="event.stopPropagation(); plusSlides(1)">❯</a>
</div>

<div class="dots">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
    <span class="dot" onclick="currentSlide(4)"></span>
    <span class="dot" onclick="currentSlide(5)"></span>
    <span class="dot" onclick="currentSlide(6)"></span>
    <span class="dot" onclick="currentSlide(7)"></span>
    <span class="dot" onclick="currentSlide(8)"></span>
    <span class="dot" onclick="currentSlide(9)"></span>
    <span class="dot" onclick="currentSlide(10)"></span>
    <span class="dot" onclick="currentSlide(11)"></span>
</div>

</div>

<script>
let slideIndex = 1;
let autoPlay = true;

showSlides(slideIndex);

function plusSlides(n) {
    autoPlay = false;
    showSlides(slideIndex += n);
}

function currentSlide(n) {
    autoPlay = false;
    showSlides(slideIndex = n);
}

function showSlides(n) {
    let slides = document.getElementsByClassName("slide");
    let dots = document.getElementsByClassName("dot");

    if (n > slides.length) slideIndex = 1;
    if (n < 1) slideIndex = slides.length;

    for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
    for (let i = 0; i < dots.length; i++) dots[i].className = dots[i].className.replace(" active", "");

    slides[slideIndex - 1].style.display = "block";
    dots[slideIndex - 1].className += " active";
}

setInterval(() => {
    if (autoPlay) {
        slideIndex++;
        showSlides(slideIndex);
    }
}, 4000);

function openFullscreen(elem) {
    document.getElementById("fsClose").style.display = "block";
    if (elem.requestFullscreen) elem.requestFullscreen();
}

function closeFullscreen() {
    document.getElementById("fsClose").style.display = "none";
    if (document.exitFullscreen) document.exitFullscreen();
}

document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        document.getElementById("fsClose").style.display = "none";
    }
});
</script>

</body>
</html>
