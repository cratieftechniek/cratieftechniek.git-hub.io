<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesprek Slavernijverleden – Creatief Techniek</title>

<style>
    :root { --accent: #f5d08a; }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    /* NAVIGATIE */
    .nav-header {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        z-index: 50;
    }

    .nav-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: bold;
        background: rgba(0,0,0,0.6);
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255,200,120,0.25);
        transition: 0.2s;
    }

    .nav-link:hover {
        background: rgba(255,200,120,0.15);
    }

    .nav-follow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-weight: bold;
    }

    .insta-icon img {
        width: 45px;
        opacity: 0.9;
        transition: 0.2s;
    }

    .insta-icon img:hover {
        opacity: 1;
    }

    /* PAGINA LAYOUT */
    .wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 120px 20px 40px;
        position: relative;
    }

    .wrapper::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent);
        z-index: 0;
    }

    h1 {
        color: var(--accent);
        margin-bottom: 20px;
        position: relative;
        z-index: 2;
    }

    p {
        line-height: 1.6;
        position: relative;
        z-index: 2;
    }

    a { color: var(--accent); }

    .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
        position: relative;
        z-index: 2;
    }

    .gallery img {
        width: calc(50% - 10px);
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    /* MOBIEL & TABLET FIXES */
    @media (max-width: 1024px) {

        .nav-link {
            padding: 6px 12px;
            font-size: 14px;
        }

        .insta-icon img {
            width: 30px;
        }

        .wrapper {
            padding: 100px 20px 40px;
        }

        .gallery img {
            width: 100%;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
</head>

<body>

<header class="nav-header">
    <a href="index.html" class="nav-link">Home</a>
    <a href="projecten.html" class="nav-link">Projecten</a>

    <div class="nav-follow">
        <span>Volg ons op:</span>
        <a href="https://www.instagram.com/creatieftechniek" target="_blank" class="insta-icon">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>
</header>

<div class="wrapper">

<h1>Gesprek Slavernijverleden</h1>

<p>
    Voor het project <strong>Gesprek Slavernijverleden</strong> werkte ik mee aan 3D‑visualisaties en 
    technische montageconstructies die onderdeel werden van de interactieve installatie.
</p>

<p>
    Website van het project:  
    <a href="https://gesprekslavernijverleden.nl" target="_blank">gesprekslavernijverleden.nl</a>
</p>

<div class="gallery">
    <img src="slavernij1.jpg" alt="">
    <img src="slavernij2.jpg" alt="">
</div>

</div>

</body>
</html>
