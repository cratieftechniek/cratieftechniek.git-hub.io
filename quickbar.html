<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickbar</title>

    <style>
        .quickbar {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px 0;
            background-color: #000;
        }

        .quickbar a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: yellow;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        /* Standaard grootte voor iconen */
        .quickbar img {
            width: 60px;
            height: auto;
        }

        /* Alleen het 3D-icoon groter maken */
        .icon-3d {
            width: 80px;
            height: auto;
        }

        /* Responsief voor mobiel */
        @media (max-width: 600px) {
            .quickbar img {
                width: 45px;
            }
            .icon-3d {
                width: 60px;
            }
        }
    </style>
</head>

<body>

<div class="quickbar">
    <a href="index.html">
        <img src="home.png" alt="Home">
        <span>Home</span>
    </a>

    <a href="projecten.html">
        <img src="projecten.png" alt="Projecten">
        <span>Projecten</span>
    </a>

    <a href="3D Print Calculator.html">
        <img src="3D.png" alt="3D Calculator" class="icon-3d">
        <span>3D Calculator</span>
    </a>

    <a href="https://www.instagram.com/creatieftechniek" target="_blank">
        <img src="instagram.png" alt="Instagram">
        <span>Instagram</span>
    </a>

    <a href="https://www.linkedin.com/company/111640182" target="_blank">
        <img src="linkedin.png" alt="LinkedIn">
        <span>LinkedIn</span>
    </a>
</div>

</body>
</html>
