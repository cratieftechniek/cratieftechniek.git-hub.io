<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projecten – Creatief Techniek</title>

<style>
    :root { --accent: #f5d08a; }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        position: relative;
    }

    /* LICHTE TINTEN / GLOW ACHTERGROND */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at top left, rgba(255,200,120,0.18), transparent 70%);
        z-index: -1;
        pointer-events: none;
    }

    /* NAVIGATIE */
    .nav-header {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        z-index: 50;
    }

    .nav-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: bold;
        background: rgba(0,0,0,0.6);
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(255,200,120,0.25);
        transition: 0.2s;
    }

    .nav-link:hover {
        background: rgba(255,200,120,0.15);
    }

    .nav-follow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-weight: bold;
    }

    .insta-icon img {
        width: 45px;
        opacity: 0.9;
        transition: 0.2s;
    }

    .insta-icon img:hover {
        opacity: 1;
    }

    /* PAGINA LAYOUT */
    .wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 140px 20px 40px;
        position: relative;
        z-index: 2;
    }

    h1 {
        text-align: center;
        color: var(--accent);
        margin-bottom: 40px;
    }

    /* PROJECT KAARTEN */
    .project-card {
        display: block;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 25px;
        text-decoration: none;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
        transition: 0.25s;
        backdrop-filter: blur(4px);
    }

    .project-card:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.3);
        transform: translateY(-3px);
    }

    .project-card h2 {
        margin-top: 0;
        color: var(--accent);
    }

    .project-card p {
        margin-bottom: 10px;
    }

    .project-link {
        display: inline-block;
        margin-top: 10px;
        font-weight: bold;
        color: var(--accent);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
        .nav-header {
            top: 10px;
            right: 10px;
            gap: 15px;
        }
        .nav-link {
            padding: 8px 14px;
            font-size: 14px;
        }
        .insta-icon img {
            width: 32px;
        }
    }

    @media (max-width: 600px) {
        .nav-header {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            gap: 10px;
            z-index: 999;
        }

        .nav-link {
            padding: 6px 10px;
            font-size: 13px;
        }

        .insta-icon img {
            width: 28px;
        }

        .wrapper {
            padding: 120px 15px 40px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
</head>

<body>

<header class="nav-header">
    <a href="index.html" class="nav-link">Home</a>
    <a href="projecten.html" class="nav-link">Projecten</a>

    <div class="nav-follow">
        <span>Volg ons op:</span>
        <a href="https://www.instagram.com/creatieftechniek" target="_blank" class="insta-icon">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>
</header>

<div class="wrapper">

<h1>Projecten</h1>

<a href="project-slavernijverleden.html" class="project-card">
    <h2>Gesprek Slavernijverleden</h2>
    <p>3D‑werkzaamheden en technische montageconstructies voor de installatie.</p>
    <span class="project-link">Bekijk project →</span>
</a>

<a href="project-muilkorf.html" class="project-card">
    <h2>3D‑geprinte muilkorf voor Cane Corso</h2>
    <p>Maatwerk ontwerp en 3D‑print voor Orthopedieren.</p>
    <span class="project-link">Bekijk project →</span>
</a>

</div>

</body>
</html>
